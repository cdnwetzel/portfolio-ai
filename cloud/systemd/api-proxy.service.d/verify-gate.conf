[Service]
# Retrieval-relevance gate for verification (verify_gate.py): when the top evidence
# chunk scores below this, verification is skipped to avoid false-positive flags on
# non-KB answers. 0.002 = the calibrated value per the service.d README.
#
# Committed 2026-11-16 from the service.d README documentation; reconcile against the
# live /etc/systemd/system/api-proxy.service.d/verify-gate.conf on next deploy touch.
Environment=VERIFY_MIN_SCORE=0.002
