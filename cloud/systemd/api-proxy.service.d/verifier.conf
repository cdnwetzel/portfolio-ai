[Service]
# Out-of-band faithfulness judge (see api-proxy.py VERIFIER_URL block).
# 127.0.0.1:8007 is the VPS-side loopback: the portfolio-ai-tunnel forwards it over
# the home LAN to the judge on the asrock B550. (NOT the T5810's own :8007, which is
# the vLLM backend slot — the port-number collision is exactly what the kb port-table
# drift fix is about; see plans/demo-surface-plan-2026-11-16.md gap 3.)
#
# Committed 2026-11-16 from the service.d README documentation; reconcile against the
# live /etc/systemd/system/api-proxy.service.d/verifier.conf on next deploy touch.
Environment=VERIFIER_URL=http://127.0.0.1:8007
Environment=VERIFIER_TIMEOUT=20.0
