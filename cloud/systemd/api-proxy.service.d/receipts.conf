[Service]
# Demo surface M1 (plans/demo-surface-plan-2026-11-16.md): persist every faithfulness
# verdict so per-answer receipts and /api/status can resolve them after the fact.
# Unset = persistence off (verdicts still push to open sockets when the judge runs).
# The directory is created and chowned by cloud/deploy.sh.
Environment=VERDICT_LOG=/var/lib/api-proxy/verdicts.jsonl
